version: 2
updates:
  - package-ecosystem: pip
    directory: "/requirements"
    schedule:
      interval: weekly
    # CI supports Python 3.10. NumPy 2.3+ and scikit-learn 1.8+
    # require newer Python; revisit when the support matrix changes.
    ignore:
      - dependency-name: numpy
        versions: [">=2.3.0"]
      - dependency-name: scikit-learn
        versions: [">=1.8.0"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
