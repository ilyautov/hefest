name: tests

# Защищает главный инвариант проекта: офлайн-контур работает у любого, кто просто склонировал
# репозиторий. Без Ollama, без сети, без Git LFS (эмбеддинги не выкачиваются), без собранного
# семантического индекса. Семантика здесь намеренно недоступна — сьют обязан это пережить
# деградацией до лексического пола, а не падением.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Заведомо мёртвый адрес: если код всё же полезет в Ollama, он должен деградировать, а не висеть.
  OLLAMA_HOST: http://127.0.0.1:59999

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false   # эмбеддинги (~106 МБ) для офлайн-сьюта не нужны
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Установка зависимостей
        run: python -m pip install -r requirements/dev.txt
      - name: Предпубликационный сторож (секреты, .env, обезличивание)
        run: sh scripts/guard.sh
      - name: Компиляция всех трекаемых модулей
        run: git ls-files '*.py' | xargs -r python -m py_compile
      - name: Офлайн-сьют
        run: python -m pytest tests/ -q

  pytest-macos:
    # Кросс-платформенность: пути от __file__, отсутствие Ollama, песочница сокетов на darwin.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка зависимостей
        run: python -m pip install -r requirements/dev.txt
      - name: Офлайн-сьют
        run: python -m pytest tests/ -q

  self-tests:
    # Каждый модуль engine/ имеет самотест в __main__ и обязан запускаться без сервиса.
    # Это свойство легко потерять незаметно, поэтому проверяется отдельной ногой.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка зависимостей
        run: python -m pip install -r requirements/dev.txt
      - name: Самотесты модулей без сети
        run: |
          set -e
          for m in cas compat ghs_map rd_zone hygiene normative warehouse waste_calc; do
            echo "--- engine/$m.py"
            python engine/$m.py > /dev/null
          done
